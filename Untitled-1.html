<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Подарок для Зухал</title>
    <!-- Подключаем красивый кириллический шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at center, #2a001a 0%, #0d001a 60%, #000000 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Marck Script', cursive;
        }

        /* Звёзды на фоне */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Холст для сердца */
        canvas {
            position: relative;
            z-index: 10;
            filter: drop-shadow(0 0 20px rgba(255, 23, 68, 0.5));
        }

        /* Нижняя надпись */
        .gift-text {
            position: absolute;
            bottom: 8%;
            font-size: clamp(32px, 6vw, 64px);
            color: #ffd700;
            text-shadow: 
                0 0 10px #ffd700, 
                0 0 20px #ff8c00, 
                0 0 40px #ff4500;
            z-index: 20;
            animation: fadeInUp 2s ease-out, shimmer 3s infinite alternate;
            text-align: center;
            width: 100%;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { text-shadow: 0 0 10px #ffd700, 0 0 20px #ff8c00; }
            100% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ff8c00, 0 0 60px #ff4500; }
        }

        /* Падающие сердечки */
        .falling-heart {
            position: absolute;
            top: -50px;
            color: #ff1744;
            animation: fall linear forwards;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 0 10px #ff1744;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>
    <canvas id="heartCanvas"></canvas>
    <div class="gift-text">Зуҳал</div>

    <script>
        // 1. Создаём звёзды
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        // 2. Анимация сердца по формуле из Python-скрипта
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        let progress = 0;
        const totalPoints = 150; // Количество слов "Зухал" по контуру
        const word = "Зухал";

        function drawHeart() {
            ctx.clearRect(0, 0, width, height);
            
            // Адаптивный масштаб сердца
            const scale = Math.min(width, height) / 45; 
            const cx = width / 2;
            const cy = height / 2 - 30;

            // Эффект пульсации после отрисовки
            let pulse = 1;
            if (progress >= 1) {
                pulse = 1 + Math.sin(Date.now() / 400) * 0.03;
            }

            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(pulse, pulse);

            const currentPoints = Math.min(Math.floor(totalPoints * progress), totalPoints);

            for (let i = 0; i <= currentPoints; i++) {
                const t = (i / totalPoints) * Math.PI * 2;

                // Точная формула из твоего Python скрипта
                const x = 16 * Math.pow(Math.sin(t), 3) * scale;
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;

                // Вычисляем угол наклона для текста (производные)
                const dx = 48 * Math.pow(Math.sin(t), 2) * Math.cos(t) * scale;
                const dy = (13 * Math.sin(t) - 10 * Math.sin(2 * t) - 6 * Math.sin(3 * t) - 4 * Math.sin(4 * t)) * scale;
                const angle = Math.atan2(dy, dx);

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                // Стиль текста
                ctx.font = `bold ${Math.max(12, scale * 0.9)}px 'Marck Script', cursive`;
                ctx.fillStyle = "#ff1744";
                ctx.shadowColor = "#ff1744";
                ctx.shadowBlur = 15;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                ctx.fillText(word, 0, 0);
                ctx.restore();
            }

            ctx.restore();

            // Анимация отрисовки
            if (progress < 1) {
                progress += 0.008; // Скорость рисования
            }
            
            requestAnimationFrame(drawHeart);
        }

        drawHeart();

        // 3. Падающие сердечки (эффект подарка)
        function createFallingHeart() {
            const heart = document.createElement('div');
            heart.className = 'falling-heart';
            heart.textContent = ['❤️', '💖', '💗', '💕'][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createFallingHeart, 400);
    </script>
</body>
</html>
